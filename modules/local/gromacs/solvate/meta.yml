---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "gromacs_solvate"
description: Fill the simulation box with solvent
keywords:
  - molecular dynamics
  - solvation
  - water
tools:
  - "gromacs":
      description: "Molecular dynamics simulation package"
      homepage: "https://www.gromacs.org"
      documentation: "https://manual.gromacs.org"
      tool_dev_url: "https://gitlab.com/gromacs/gromacs"
      doi: "10.1016/j.softx.2015.06.001"
      licence: ["LGPL-2.1-or-later"]
      identifier: biotools:gromacs
      args_id: "$args"

input:
  - - meta:
            type: map
            description: |
              Groovy Map containing sample information
              e.g. `[ id:'sample1' ]`
    - gro:
          type: file
          description: GROMACS structure
          pattern: "*.gro"
    - top:
          type: file
          description: System topology
          pattern: "*.top"

output:
  gro:
    - - meta:
              type: map
              description: |
                Groovy Map containing sample information
                e.g. `[ id:'sample1' ]`
      - "${prefix}.gro":
          type: file
          description: GROMACS structure
          pattern: "*.gro"
  top:
    - - meta:
              type: map
              description: |
                Groovy Map containing sample information
                e.g. `[ id:'sample1' ]`
      - "topol.top":
          type: file
          description: System topology
          pattern: "*.top"
  versions_gromacs:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gromacs":
          type: string
          description: The name of the tool
      - "${task.ext.gmx_cmd ?: 'gmx'} --version 2>/dev/null | sed -n 's/^GROMACS version:[[:space:]]*//p' | head -n 1 || true":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gromacs":
          type: string
          description: The name of the tool
      - "${task.ext.gmx_cmd ?: 'gmx'} --version 2>/dev/null | sed -n 's/^GROMACS version:[[:space:]]*//p' | head -n 1 || true":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@sarata00"
maintainers:
  - "@sarata00"
