---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "gromacs_grompp"
description: Preprocess parameters, structure and topology into a run input file
keywords:
  - molecular dynamics
  - preprocessing
  - run input
tools:
  - "gromacs":
      description: "Molecular dynamics simulation package"
      homepage: "https://www.gromacs.org"
      documentation: "https://manual.gromacs.org"
      tool_dev_url: "https://gitlab.com/gromacs/gromacs"
      doi: "10.1016/j.softx.2015.06.001"
      licence: ["LGPL-2.1-or-later"]
      identifier: biotools:gromacs
      args_id: "$args"

input:
  - - meta:
            type: map
            description: |
              Groovy Map containing sample information
              e.g. `[ id:'sample1' ]`
    - mdp:
          type: file
          description: Simulation parameters
          pattern: "*.mdp"
    - gro:
          type: file
          description: GROMACS structure
          pattern: "*.gro"
    - top:
          type: file
          description: System topology
          pattern: "*.top"
    - itp:
          type: file
          description: Include topology files, for example position restraints
          pattern: "*.itp"
    - restraint_gro:
          type: file
          description: Optional reference structure for position restraints
          pattern: "*.gro"

output:
  tpr:
    - - meta:
              type: map
              description: |
                Groovy Map containing sample information
                e.g. `[ id:'sample1' ]`
      - "${prefix}.tpr":
          type: file
          description: Portable binary run input
          pattern: "*.tpr"
  versions_gromacs:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gromacs":
          type: string
          description: The name of the tool
      - "${task.ext.gmx_cmd ?: 'gmx'} --version 2>/dev/null | sed -n 's/^GROMACS version:[[:space:]]*//p' | head -n 1 || true":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gromacs":
          type: string
          description: The name of the tool
      - "${task.ext.gmx_cmd ?: 'gmx'} --version 2>/dev/null | sed -n 's/^GROMACS version:[[:space:]]*//p' | head -n 1 || true":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@sarata00"
maintainers:
  - "@sarata00"
