---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "pdb_checkmissing"
description: Stop if a PDB file reports missing residues or atoms
keywords:
  - pdb
  - validation
  - missing atoms
  - preprocessing
tools:
  - "grep":
      description: "Search files for lines matching a pattern"
      homepage: "https://www.gnu.org/software/grep/"
      documentation: "https://www.gnu.org/software/grep/manual/grep.html"
      tool_dev_url: "https://git.savannah.gnu.org/cgit/grep.git"
      doi: ""
      licence: ["GPL-3.0-or-later"]
      identifier: ""
      args_id: "$args"

input:
  - - meta:
            type: map
            description: |
              Groovy Map containing sample information
              e.g. `[ id:'sample1' ]`
    - pdb:
          type: file
          description: Protein structure
          pattern: "*.pdb"

output:
  pdb:
    - - meta:
              type: map
              description: |
                Groovy Map containing sample information
                e.g. `[ id:'sample1' ]`
      - "${prefix}.pdb":
          type: file
          description: Protein structure
          pattern: "*.pdb"
  versions_grep:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "grep":
          type: string
          description: The name of the tool
      - "{ grep --version 2>&1 || true; grep --help 2>&1 || true; } | sed -n -E 's/^.*(BusyBox v|GNU grep[^0-9]*)([0-9]+[.][0-9.]+).*/\\\\2/p' | head -n 1 || true":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "grep":
          type: string
          description: The name of the tool
      - "{ grep --version 2>&1 || true; grep --help 2>&1 || true; } | sed -n -E 's/^.*(BusyBox v|GNU grep[^0-9]*)([0-9]+[.][0-9.]+).*/\\\\2/p' | head -n 1 || true":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@sarata00"
maintainers:
  - "@sarata00"
