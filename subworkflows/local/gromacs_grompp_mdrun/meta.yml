---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "gromacs_grompp_mdrun"
description: Build a GROMACS run input file and run it
keywords:
  - molecular dynamics
  - simulation
  - energy minimisation
components:
  - gromacs/grompp
  - gromacs/mdrun
input:
  - ch_mdp:
      description: |
        Simulation parameters. Structure: [ val(meta), path(file) ]
  - ch_gro:
      description: |
        Starting structure. Structure: [ val(meta), path(file) ]
  - ch_top:
      description: |
        System topology. Structure: [ val(meta), path(file) ]
  - ch_itp:
      description: |
        Include topology files. Structure: [ val(meta), path(file) ]
  - val_restraints:
      description: |
        Boolean: use the starting structure as reference for position restraints
output:
  - tpr:
      description: |
        Run input file. Structure: [ val(meta), path(file) ]
  - gro:
      description: |
        Final structure. Structure: [ val(meta), path(file) ]
  - edr:
      description: |
        Energies. Structure: [ val(meta), path(file) ]
  - run_log:
      description: |
        Run log. Structure: [ val(meta), path(file) ]
  - xtc:
      description: |
        Compressed trajectory, optional. Structure: [ val(meta), path(file) ]
authors:
  - "@sarata00"
maintainers:
  - "@sarata00"
